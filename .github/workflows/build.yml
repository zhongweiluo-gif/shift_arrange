name: Build Executables

on:
  workflow_dispatch:  

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller --name "Shift_System" --onedir main.py

    - name: Zip Build (Windows)
      if: matrix.os == 'windows-latest'
      run: Compress-Archive -Path dist\Shift_System -DestinationPath Shift_System_Windows.zip

    - name: Zip Build (macOS)
      if: matrix.os == 'macos-latest'
      run: zip -r Shift_System_macOS.zip dist/Shift_System

    - name: Upload Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Build
        path: Shift_System_Windows.zip

    - name: Upload Artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Build
        path: Shift_System_macOS.zip